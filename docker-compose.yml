# ============================================
# CheckLis Booking — Docker Compose
# ============================================
# Использование:
#   Локальная разработка: docker compose up --build
#   Продакшен: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================

x-backend-env: &backend-env
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-checklis}
  POSTGRES_USER: ${POSTGRES_USER:-checklis_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

version: "3.9"

services:
  # ============================================
  # PostgreSQL — основная база данных
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: checklis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checklis}
      POSTGRES_USER: ${POSTGRES_USER:-checklis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checklis_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - checklis-net

  # ============================================
  # Redis — кэш и очередь для Celery
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: checklis-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - checklis-net

  # ============================================
  # Backend — FastAPI приложение
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-checklis-backend:local}
    container_name: checklis-backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level info
      --workers 4
    networks:
      - checklis-net

  # ============================================
  # Celery Worker — фоновые задачи (уведомления)
  # ============================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-checklis-backend:local}
    container_name: checklis-celery-worker
    restart: unless-stopped
    environment:
      <<: *backend-env
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.notifications:celery_app worker
      --loglevel=info
      --concurrency=2
    networks:
      - checklis-net

  # ============================================
  # Celery Beat — планировщик задач
  # ============================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-checklis-backend:local}
    container_name: checklis-celery-beat
    restart: unless-stopped
    environment:
      <<: *backend-env
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks.notifications:celery_app beat
      --loglevel=info
    networks:
      - checklis-net

  # ============================================
  # Frontend — статические файлы (собранный React)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${FRONTEND_IMAGE:-checklis-frontend:local}
    container_name: checklis-frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/app/dist
    networks:
      - checklis-net

  # ============================================
  # Nginx — reverse proxy, SSL, CORS
  # ============================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ${NGINX_IMAGE:-checklis-nginx:local}
    container_name: checklis-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - checklis-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  frontend_dist:
    driver: local
  certbot_webroot:
    driver: local

networks:
  checklis-net:
    driver: bridge
