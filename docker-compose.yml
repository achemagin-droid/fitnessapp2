version: "3.9"

services:
  # ============================================
  # PostgreSQL — основная база данных
  # ============================================
  db:
    image: postgres:16-alpine
    container_name: checklis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checklis}
      POSTGRES_USER: ${POSTGRES_USER:-checklis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checklis_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis — кэш и очередь для Celery
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: checklis-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend — FastAPI приложение
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checklis-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --log-level info

  # ============================================
  # Celery Worker — фоновые задачи (уведомления)
  # ============================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checklis-celery-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks worker
      --loglevel=info
      --concurrency=2

  # ============================================
  # Celery Beat — планировщик задач
  # ============================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checklis-celery-beat
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.tasks beat
      --loglevel=info

  # ============================================
  # Frontend — статические файлы (собранный React)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: checklis-frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/app/dist

  # ============================================
  # Nginx — reverse proxy, SSL, CORS
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: checklis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  frontend_dist:
    driver: local
